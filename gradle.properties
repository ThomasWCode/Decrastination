# One warm Gradle daemon, with Kotlin's compile daemon beside it (the only way Kotlin compiles
# incrementally): each held to a heap and a metaspace, so neither creeps, Gradle's own check
# retiring a daemon near its limits; each handing back memory it isn't using a minute after its
# last collection; both stopping after 15 idle minutes. docs/development.md says why.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:G1PeriodicGCInterval=60000 -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10 -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:G1PeriodicGCInterval=60000 -XX:MaxHeapFreeRatio=30 -XX:MinHeapFreeRatio=10
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
