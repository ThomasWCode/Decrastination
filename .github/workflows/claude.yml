name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so Claude can diff against the base branch and use git log/blame

      # The template's Python and R set-ups, each run only where the repository has the matching
      # dependency file: it has neither requirements.txt nor DESCRIPTION, so neither runs. The reviewer
      # doesn't build or test (no JDK or Gradle here); CI's build check does.
      - name: Set up Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt pytest

      - name: Set up R
        if: hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        if: hashFiles('DESCRIPTION') != ''
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Show a progress checklist comment while Claude works
          track_progress: true

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff *),Bash(git log *),Bash(git blame *),Bash(gh pr *),Bash(pytest *),Bash(python -m pytest *),Bash(Rscript *),Bash(R CMD check *)"
            --append-system-prompt "When asked to review a PR: read every changed file in full plus the code that calls it, not just the diff hunks. Check correctness, edge cases, numerical and statistical validity, reproducibility (seeds, pinned versions), error handling, security, performance and test coverage. Check CI results. Separate findings into Major and Minor; for each give the file and line, the problem, why it matters, and a concrete fix. Post line-specific findings as inline comments. Say explicitly what you did not check."
