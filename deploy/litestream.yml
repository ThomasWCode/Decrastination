# Streams the server's database to a private R2 bucket, continuously (docs/plan_web/hosting.md §Litestream).
# ${...} is read from the container's environment. A snapshot a day, kept 30 days, so `restore -timestamp`
# reaches a month back. Its metrics on the compose network alone, where the server reads whether it's still
# uploading (docs/spec/server.md §Deployment); no port is published for them.
#
# Every one of its timers is a request to R2, most of them Class A, billed past a million a month. Each LIST reads a
# whole level, a request for each 1,000 files, and L1 to L3 keep every file for the snapshots' 30 days: on the
# defaults L1 gained a file each minute and every check read all of it, about 150,000 requests a day ten days in and
# growing. These hold it to about 2,300 a day (hosting.md §Litestream).
addr: ":9090"

# Each check lists all of L1, then L0: every 15s by default. L0's files are kept 5 minutes past their compaction
# either way, so a check every 10 minutes deletes them a little later, 144 checks a day.
l0-retention-check-interval: 10m

# The compactions into L1, L2 and L3, by default every 30s, 5m and 1h: each that has work is a PUT and a LIST of the
# level below. One every 15 minutes keeps L1 to 96 files a day, 2,880 over the 30 days, three requests a listing. The
# restore points between snapshots are 15 minutes apart, not 30 seconds.
levels:
  - interval: 15m
  - interval: 1h
  - interval: 6h

snapshot:
  interval: 24h
  retention: 720h

dbs:
  - path: /data/decrastination.db
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      # A fresh path, so the 30s compactions' files under db/ aren't listed again for the month they'd be kept.
      path: db-2
      endpoint: ${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      # An upload at most each minute, the default's each second: a box that's lost loses up to its last minute.
      sync-interval: 1m
